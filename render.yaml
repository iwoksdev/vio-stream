# Free/ephemeral deployment: accounts, lists and downloads are lost on restart/redeploy.
# No persistent disk. No management API keys belong here.
services:
  - type: web
    name: vio
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PERSISTENT_ROOT
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: ARIA2_RPC_SECRET
        generateValue: true
      - key: ARIA2_DOWNLOAD_LIMIT
        value: "0"
      - key: DOWNLOAD_ALLOWED_HOSTS
        value: media.w3.org,download.blender.org,yts.gg
      - key: MAX_PLAYBACK_TICKETS
        value: "10000"
      - key: JELLYFIN_URL
        value: ""
      - key: JELLYFIN_API_KEY
        value: ""
      - key: JELLYFIN_USER_ID
        value: ""
